id: veh.tests.suite-x86
revision: 1
summary: Run every DAP/MCP integration test file against the x86 build (build32) with per-file timeouts and process cleanup
use_when:
  - verifying architecture-sensitive changes on 32-bit targets
tags: [veh-debugger, tests, integration, dap, mcp, x86]
execution:
  kind: cli
  executable_ref: py
  cwd: .
  argv_template: [-3, tools/run_tests.py, --build-dir, build32, --timeout, "120"]
  trusted_for_run: true
  timeout_sec: 1800
  artifact_mode: metadata
  preflight:
    - {id: windows.platform, kind: platform, ref: windows, requirement: required}
    - {id: python.version, kind: executable, ref: py, requirement: required, argv: [-3, --version]}
    - {id: x86.mcp, kind: file, ref: build32/bin/Release/veh-mcp-server.exe, requirement: required}
    - {id: x86.adapter, kind: file, ref: build32/bin/Release/veh-debug-adapter.exe, requirement: required}
inputs: [tools/run_tests.py, test/**, build32/bin/Release/**]
checks: [veh.tests.x86-suite]
docs: [docs/DEVELOPMENT_TOOLS.md, OVERVIEW.md]
cache_policy: disabled
